<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тұлғадан — ұжымға</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: ойын-сабақ — жарқын, бірақ ғылыми мазмұны салмақты
   IDEA: интерактив тақтадағы пиксель-комикс: студенттер өз тобын сырттан көреді
   PICTURE: 320×180 пиксель-сахна (аудитория, жатақхана, зал), кейіпкерлер жүреді, сөйлейді
   COLOUR and TYPE: терең көгілдір-жасыл жер, төрт темперамент түсі, маржан акцент; Unbounded + Golos Text
   LAYOUT: тақта 16:9 — сахна сол жақта, басқару мен статистика оң жақта; телефонда бір баған */
:root{--bg:#0c3a40;--bg2:#082b30;--card:#11474e;--card2:#16575f;--line:#2a6a72;--ink:#f6f2ea;--mut:#a7c6c3;--acc:#ff7a59;
--S:#f6c445;--C:#ff6b57;--P:#5fd1bd;--M:#b3a6ff;--disp:Unbounded,"Golos Text",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Golos Text",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:var(--disp);font-weight:700;line-height:1.08;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:14px;min-height:48px;padding:12px 20px;background:var(--card2);transition:transform .12s,background .2s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--S);outline-offset:2px}
.btn{background:var(--acc);color:#2a0c05;font-weight:700}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);font-weight:600}
.btn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #ff7a5944}}
input{font:inherit;font-size:18px;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);color:var(--ink)}
.mut{color:var(--mut)}
.orn{color:var(--acc)}
.kick{color:var(--acc);font-weight:700;font-size:15px;margin-bottom:8px}
.band{height:30px;display:flex;gap:6px;overflow:hidden;opacity:.55;padding:3px 0;background:var(--bg2)}
.band svg{flex:none;width:48px;height:24px;color:var(--S)}
.band svg:nth-child(2n){color:var(--P)}
.band svg:nth-child(3n){color:var(--acc)}
.err{background:#4a1f1a;color:#ffd9cf;border-radius:14px;padding:12px 16px}
/* ===== PIXEL STAGE ===== */
.stagebox{position:relative;width:100%;max-width:calc((100vh - 210px)*16/9);aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 24px 50px -20px #000a;border:4px solid #14232a}
.stagebox canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.stagebox img.comic{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f6f2ea}
.ov{position:absolute;inset:0;pointer-events:none;font-size:clamp(11px,1.15vw,21px)}
.bub{position:absolute;z-index:2;max-width:40%;background:#fff;color:#14232a;border:3px solid #14232a;padding:.4em .65em .45em;font-weight:600;line-height:1.28;box-shadow:4px 4px 0 #14232a;transition:opacity .3s;animation:bin .3s steps(3) backwards}
.bub::after{content:"";position:absolute;left:var(--tl,50%);bottom:-9px;width:12px;height:12px;background:#fff;border:3px solid #14232a;border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
.bub .nm{display:block;font-size:.72em;font-weight:800;color:var(--nc)}
.bub.think{border-style:dashed;border-radius:22px;font-style:italic;box-shadow:none}
.bub.think::after{border-radius:50%;border:3px dashed #14232a;bottom:-16px;width:9px;height:9px;transform:translateX(-50%)}
.bub.old{opacity:.55}.bub.older{opacity:.25}
@keyframes bin{from{transform:var(--tf) scale(.4);opacity:0}to{transform:var(--tf);opacity:1}}
.emo{position:absolute;background:#14232a;color:#ffd84a;font:800 1.05em var(--disp);padding:.05em .45em;border:3px solid #ffd84a;animation:bob .5s steps(2) infinite alternate;transform:translate(0,-100%)}
@keyframes bob{to{margin-top:-4px}}
.cap{position:absolute;left:2%;top:3%;max-width:58%;background:#ffd84a;color:#14232a;border:3px solid #14232a;padding:.35em .65em;font-weight:700;line-height:1.3;box-shadow:4px 4px 0 #14232a;animation:bin .3s steps(3) both;--tf:none;transition:opacity .4s}
.cap.dim{opacity:.4}
.chat{position:absolute;left:3%;top:20%;width:38%;background:#0f171d;border:4px solid #000;border-radius:18px;padding:.6em;display:grid;gap:.4em;box-shadow:6px 6px 0 #0006}
.chat div{background:#22313b;color:#e8eef2;border-radius:10px;padding:.35em .6em;line-height:1.3;animation:bin .3s steps(3) both;--tf:none}
.chat b{color:#7fd6ff;display:block;font-size:.8em}
.castl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cl{display:flex;align-items:center;gap:7px;background:var(--card);border-radius:999px;padding:3px 12px 3px 3px;font-size:14px}
.cl img{width:30px;height:30px;image-rendering:pixelated;background:#e9dcc0;border-radius:50%}
.cl b{font-weight:700}
/* ===== HOST ===== */
.host #app{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:10px max(2.4vw,14px);border-bottom:1px solid var(--line)}
.top .ttl{font-family:var(--disp);font-weight:700;font-size:18px}
.top .ph{margin-left:auto;color:var(--mut);font-size:15px}
.top .code{font-family:var(--disp);background:var(--card);padding:4px 12px;border-radius:10px;font-size:17px;letter-spacing:.08em}
.main{flex:1;display:grid;gap:clamp(14px,1.6vw,26px);padding:clamp(12px,1.6vw,24px) max(2.4vw,14px)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px max(2.4vw,14px);border-top:1px solid var(--line);background:var(--bg2)}
.bar .sp{flex:1}
.bar button{min-height:44px;padding:8px 18px}
.lobby{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:center}
.hero h1{font-size:clamp(40px,5.2vw,86px);font-weight:800}
.hero h1 em{font-style:normal;color:var(--S)}
.hero p{font-size:clamp(17px,1.45vw,23px);max-width:40ch;color:var(--mut)}
.qrcard{background:var(--ink);color:#0c3a40;border-radius:28px;padding:clamp(16px,2vw,28px);display:grid;justify-items:center;gap:8px;box-shadow:0 30px 60px -20px #0008}
.qrcard #qr{width:min(30vw,340px);aspect-ratio:1;display:grid;place-items:center}
.qrcard #qr img,.qrcard #qr canvas{width:100%!important;height:auto!important}
.qrcard .big{font-family:var(--disp);font-weight:800;font-size:clamp(34px,4vw,58px);letter-spacing:.12em}
.qrcard small{font-size:14px;word-break:break-all;text-align:center;color:#2a5a60}
.cloud{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;max-height:30vh;overflow:auto}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);padding:7px 14px;border-radius:999px;font-weight:600;animation:pop .35s ease-out}
.chip i{width:11px;height:11px;border-radius:50%;background:var(--P)}
.chip.off{opacity:.45}.chip.off i{background:var(--mut)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.count{font-family:var(--disp);font-size:clamp(20px,1.8vw,30px);margin-top:20px}
.count b{color:var(--S)}
.sc{grid-template-columns:minmax(0,1fr) minmax(300px,30%);align-items:start}
.sc.wide{grid-template-columns:minmax(0,1fr) minmax(380px,44%)}
.side{display:flex;flex-direction:column;gap:10px;min-height:100%}
.side h2{font-size:clamp(20px,1.7vw,30px)}
.opt-b{background:var(--card);border-radius:14px;padding:10px 14px;position:relative;overflow:hidden;cursor:default}
.opt-b .fill{position:absolute;inset:0 auto 0 0;background:#ffffff14;transition:width .6s;width:0}
.opt-b .row{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;font-size:clamp(14px,1.05vw,18px);line-height:1.35}
.opt-b .L{font-family:var(--disp);font-weight:800;color:var(--S)}
.opt-b .pc{font-family:var(--disp);font-weight:700}
.opt-b .tp{display:inline-block;margin-top:4px;font-size:13px;font-weight:700;color:#0c3a40;border-radius:999px;padding:1px 9px}
.opt-b.best{outline:3px solid var(--P)}
.opt-b .why{position:relative;margin-top:8px;font-size:clamp(13px,.95vw,16px);color:var(--mut);display:none}
.opt-b.open .why{display:block}
.opt-b.click{cursor:pointer}
.score{display:flex;gap:3px;margin-top:6px}
.score i{width:16px;height:8px;border-radius:2px;background:var(--line)}
.score i.on{background:var(--P)}
.tst{background:var(--card);border-radius:14px;padding:9px 12px;border-left:6px solid var(--tc)}
.tst b{font-size:17px}
.tst .st{font-size:14px}
.tst .st.tie{color:var(--C);font-weight:700}
.tst .st.ok{color:var(--P);font-weight:700}
.tst .scv{float:right;font-family:var(--disp);font-size:17px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;position:relative}
.tag{background:var(--tc);color:#0c3a40;font-weight:700;font-size:13px;border-radius:999px;padding:2px 9px;animation:pop .4s both}
.feed{margin-top:auto;display:grid;gap:4px;font-size:14px;color:var(--mut)}
.feed div{animation:pop .3s}
.timer{display:flex;align-items:center;gap:12px;font-family:var(--disp);font-size:30px;font-weight:800}
.timer .tb{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.timer .tb div{height:100%;background:var(--acc)}
.stagehint{font-size:14px;color:var(--mut);margin-top:8px}
.r1end{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
.circ{width:min(100%,62vh);margin:auto;aspect-ratio:1}
.circ svg{width:100%;height:100%;overflow:visible}
.dot{animation:drop .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.legend{display:grid;gap:10px}
.lg{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border-radius:16px;padding:12px 18px}
.lg i{width:20px;height:20px;border-radius:50%}
.lg b{font-family:var(--disp);font-size:26px}
.lg span{font-size:clamp(16px,1.25vw,20px)}
.lg span small{display:block;color:var(--mut);font-size:14px}
.teams{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-content:start}
.tcard{background:var(--card);border-radius:24px;padding:20px;border-top:8px solid var(--tc);animation:pop .4s ease-out both}
.tcard h3{font-size:26px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.emb{width:44px;height:44px;border-radius:50%;background:var(--tc);color:#0c3a40;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:19px;flex:none}
.mem{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:18px;border-bottom:1px dashed var(--line)}
.mem i{width:12px;height:12px;border-radius:50%;flex:none}
.rbars{display:grid;gap:12px}
.rb{display:grid;grid-template-columns:220px minmax(0,1fr) 50px;gap:14px;align-items:center;font-size:20px}
.rb .tr{height:36px;background:var(--bg2);border-radius:10px;overflow:hidden}
.rb .tr div{height:100%;background:var(--S);border-radius:10px;transition:width .6s}
.rb b{font-family:var(--disp);text-align:right}
.podium{display:flex;gap:18px;align-items:end;justify-content:center;min-height:300px}
.pod{width:min(210px,20vw);text-align:center}
.pod .blk{background:var(--tc);color:#0c3a40;border-radius:20px 20px 6px 6px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:clamp(28px,3vw,46px);animation:grow .9s cubic-bezier(.2,1.2,.4,1) both;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}}
.pod h3{font-size:22px;margin:10px 0 2px}
.quote{font-size:clamp(20px,1.7vw,27px);max-width:46ch;font-weight:500}
/* ===== PHONE ===== */
.phone #app{max-width:560px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
.phone h1{font-size:30px}
.phone h2{font-size:22px}
.pcard{background:var(--card);border-radius:22px;padding:18px;margin-top:14px}
.who{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mut)}
.who .emb{width:30px;height:30px;font-size:14px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;background:var(--card2);padding:14px 16px;font-size:17px;line-height:1.35;border:2px solid transparent;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.opt .L{font-family:var(--disp);font-weight:800;color:var(--S)}
.opt.sel{border-color:var(--S);background:#245f55}
.look{display:flex;gap:12px;align-items:center;background:#ffd84a;color:#14232a;border-radius:16px;padding:12px 14px;font-weight:700;margin-top:14px}
.look svg{flex:none}
.res{border-radius:26px;padding:22px;color:#12323a;margin-top:14px}
.res h1{font-size:34px}
.res .nick{font-weight:700;margin:6px 0 12px}
.res p{margin:8px 0}
.res .lab{font-weight:800;font-size:13px;opacity:.75;display:block}
.picks{display:grid;gap:6px;margin-top:10px;clear:both}
.picks div{display:grid;grid-template-columns:100px minmax(0,1fr) 20px;gap:8px;align-items:center;font-size:14px;font-weight:600}
.picks .t{height:10px;border-radius:5px;background:#12323a22;overflow:hidden}
.picks .t i{display:block;height:100%;background:#12323a}
.tbar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:12px}
.tbar div{height:100%;background:var(--acc);transition:width .25s linear}
.mates{display:grid;gap:6px;margin-top:10px;font-size:15px}
.mates div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.big-ok{font-family:var(--disp);font-size:36px;font-weight:800}
.landing{display:grid;place-items:center;min-height:calc(100vh - 30px);padding:24px;text-align:center}
.landing .box{max-width:760px;display:grid;gap:20px;justify-items:center}
.landing h1{font-size:clamp(38px,6vw,72px);font-weight:800}
.landing h1 em{font-style:normal;color:var(--S)}
.roles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.roles button{min-width:240px;padding:18px 24px;font-size:18px}
@media(max-width:900px){.lobby,.sc,.r1end{grid-template-columns:minmax(0,1fr)}.qrcard #qr{width:min(70vw,320px)}.stagebox{max-width:none}.rb{grid-template-columns:120px minmax(0,1fr) 40px;font-size:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

   ['chat','Ерлан','[сенің сабақта ұйықтап отырған суретің] «Біздің топтың жұлдызы»'],['chat','Асан','ахахаха, мен де байқадым!'],

 {title:'Старостаға ұсыныс',bg:'class',
  cast:{asan:'F0',erlan:'F1',dana:'F2',you:'F3',mira:'B1',bekzat:'B3',kur:{x:300,y:100,hidden:1}},

const dur=t=>Math.min(5600,1300+String(t).length*46);
class Stage{
 constructor(box,scene,img){
  this.box=box;this.alive=true;this.tok=0;this.t=0;
  if(img){box.innerHTML=`<img class="comic" src="${img}" alt="${esc(scene.title)}">`;this.img=true;return;}
  box.innerHTML='<canvas width="320" height="180"></canvas><div class="ov"></div>';
  this.cv=box.querySelector('canvas');this.g=this.cv.getContext('2d');this.ov=box.querySelector('.ov');this.scene=scene;
  this.loop=this.loop.bind(this);requestAnimationFrame(this.loop);
 }
 reset(){
  const sc=this.scene;this.bg=makeBG(sc.bg);this.ch={};this.bubs=[];this.ov.innerHTML='';this.capEl=null;this.chatEl=null;this.emos={};
  for(const[id,sp]of Object.entries(sc.cast)){
   if(typeof sp==='string'){const[sx,sy]=SEATS[sp];this.ch[id]={id,c:CAST[id],x:sx,y:sy+4,pose:'sit',desk:sy};}
   else this.ch[id]={id,c:CAST[id],x:sp.x,y:sp.y,pose:sp.pose||'stand',hidden:!!sp.hidden,phone:!!sp.phone};
  }
 }
 destroy(){this.alive=false;this.tok++;}
 loop(){
  if(!this.alive)return;this.t++;const g=this.g;
  if(this.bg){
   g.drawImage(this.bg,0,0);const items=[];
   if(this.scene.bg==='class')Object.values(SEATS).forEach(d=>items.push({y:d[1]+.5,f:()=>drawDesk(g,d[0],d[1])}));
   Object.values(this.ch).forEach(o=>{if(!o.hidden)items.push({y:o.pose==='sit'&&o.desk!=null?o.desk:o.y,f:()=>drawChar(g,o.c,o.x,o.y,o,Math.floor(this.t/9),o.talk&&this.t%14<7)});});
   items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
   this.place();
  }
  requestAnimationFrame(this.loop);
 }
 head(o){return o.y-(o.pose==='sit'?21:24);}
 place(){
  for(const b of this.bubs){const o=this.ch[b.id];const ax=o.x<85?.14:o.x>235?.86:.5;
   b.el.style.left=(o.x/PW*100)+'%';b.el.style.top=((this.head(o)-4)/PH*100)+'%';
   const tf=`translate(${-ax*100}%,-100%)`;b.el.style.transform=tf;b.el.style.setProperty('--tf',tf);b.el.style.setProperty('--tl',(ax*100)+'%');}
  for(const[id,el]of Object.entries(this.emos)){const o=this.ch[id];el.style.left=((o.x+6)/PW*100)+'%';el.style.top=((this.head(o)+2)/PH*100)+'%';}
 }
 sleep(ms,tok){return new Promise(r=>{if(this.fast)return r();const t0=Date.now();const chk=()=>{if(tok!==this.tok||this.fast||Date.now()-t0>=ms)r();else setTimeout(chk,60);};setTimeout(chk,60);});}
 say(id,text,kind){
  const o=this.ch[id];
  this.bubs=this.bubs.filter(b=>{if(b.id===id){b.el.remove();return false;}return true;});
  this.bubs=this.bubs.filter(b=>{b.age++;if(b.age>=3){b.el.remove();return false;}b.el.classList.toggle('old',b.age===1);b.el.classList.toggle('older',b.age===2);return true;});
  const el=document.createElement('div');el.className='bub '+(kind==='think'?'think':'');
  el.style.setProperty('--nc',shade(o.c.top,.62));el.innerHTML=`<b class="nm">${esc(o.c.name)}${kind==='think'?' ойлайды':''}</b>${esc(text)}`;
  this.ov.appendChild(el);this.bubs.push({id,el,age:0});
  Object.values(this.ch).forEach(c=>c.talk=false);if(kind!=='think')o.talk=true;if(this.capEl)this.capEl.classList.add('dim');this.place();
 }
 emo(id,sym,keep){
  const o=this.ch[id];if(this.emos[id])this.emos[id].remove();
  const el=document.createElement('div');el.className='emo';el.textContent=sym;this.ov.appendChild(el);this.emos[id]=el;
  if(sym==='zzz')o.sleep=true;this.place();
 }
 cap(t){if(this.capEl)this.capEl.remove();const el=document.createElement('div');el.className='cap';el.textContent=t;this.ov.appendChild(el);this.capEl=el;}
 chat(who,t){if(this.capEl)this.capEl.classList.add('dim');if(!this.chatEl){this.chatEl=document.createElement('div');this.chatEl.className='chat';this.ov.appendChild(this.chatEl);}
  const m=document.createElement('div');m.innerHTML=`<b>${esc(who)}</b>${esc(t)}`;this.chatEl.appendChild(m);if(this.chatEl.children.length>4)this.chatEl.firstChild.remove();}
 walk(id,x,y,tok){const o=this.ch[id];o.hidden=false;o.pose='stand';
  return new Promise(res=>{let last=Date.now();const step=()=>{if(tok!==this.tok||!this.alive)return res();
   const now=Date.now(),sp=Math.min(12,(now-last)*.085);last=now;
   const dx=x-o.x,dy=y-o.y,d=Math.hypot(dx,dy);
   if(this.fast||d<=Math.max(sp,.5)){o.x=x;o.y=y;o.walking=false;return res();}
   o.x+=dx/d*sp;o.y+=dy/d*sp;o.walking=true;setTimeout(step,16);};step();});}
 async exec(s,tok){
  const[k,a,b,c]=s;
  if(k==='cap'){this.cap(a);await this.sleep(dur(a),tok);}
  else if(k==='say'||k==='think'){this.say(a,b,k);await this.sleep(dur(b),tok);}
  else if(k==='chat'){this.chat(a,b);await this.sleep(dur(b),tok);}
  else if(k==='emo'){this.emo(a,b);await this.sleep(c??700,tok);}
  else if(k==='hand'){this.ch[a].hand=!!b;await this.sleep(250,tok);}
  else if(k==='enter'){const o=this.ch[a];o.hidden=false;o.x=300;o.y=100;await this.walk(a,300,176,tok);await this.walk(a,b,176,tok);}
  else if(k==='walk'){await this.walk(a,b,c,tok);}
  else if(k==='wait'){await this.sleep(a,tok);}
 }
 async play(onDone,fast){
  if(this.img){onDone&&onDone();return;}
  const tok=++this.tok;this.fast=!!fast;this.reset();
  for(const s of this.scene.steps){if(tok!==this.tok||!this.alive)return;await this.exec(s,tok);}
  if(tok===this.tok&&this.alive){Object.values(this.ch).forEach(c=>c.talk=false);onDone&&onDone();}
 }
 skip(){this.fast=true;}
}

   const sc=R1[S.si],c=[0,0,0,0];let n=0;ps.forEach(p=>{const k=p.a1[S.si];if(k!=null){c[k]++;n++;}});
   const el=$('#r1o');if(el)el.innerHTML=ORD[S.si].map((k,li)=>{const pc=n?Math.round(c[k]/n*100):0;const T=TYPES[sc.o[k][1]];
     return `<div class="opt-b"><div class="fill" style="width:${S.show?pc:0}%;${S.reveal?`background:${T.col}33`:''}"></div><div class="row"><span class="L">${LET[li]}</span><span>${esc(sc.o[k][0])}${S.reveal?`<br><span class="tp" style="background:${T.col}">${T.name}</span>`:''}</span><span class="pc">${S.show?pc+'%':''}</span></div></div>`;}).join('');
   const ac=$('#ac');if(ac)ac.textContent=n+' / '+ps.length;
   const sb=$('#shw');if(sb)sb.textContent=S.show?'Таңдауды жасыру':'Топтың таңдауын көрсету';
  }
  if(ph==='r1end'){
   const g=$('#dots');if(g&&!g.childNodes.length){ps.filter(p=>p.res).forEach((p,i)=>{const[x,y]=p.xy;const el=document.createElementNS('http://www.w3.org/2000/svg','g');
     el.innerHTML=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="dot" style="animation-delay:${i*.12}s"><circle r="15" fill="${TYPES[p.res.type].col}" stroke="#0c3a40" stroke-width="3"/><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#0c3a40" font-family="Golos Text">${esc(p.name[0]||'?')}</text></g></g>`;g.appendChild(el);});}
   const cnt={S:0,C:0,P:0,M:0};ps.forEach(p=>{if(p.res)cnt[p.res.type]++;});
   const lg=$('#lg');if(lg)lg.innerHTML=Object.keys(TYPES).map(k=>`<div class="lg"><i style="background:${TYPES[k].col}"></i><span>${TYPES[k].name}<small>${TYPES[k].nick}</small></span><b>${cnt[k]}</b></div>`).join('');
  }
  if(ph==='r2vote'||ph==='r2rev'||ph==='r2play'){
   const el=$('#tst');if(el)el.innerHTML=S.teams.map((t,ti)=>{
    let st,cl='';
    if(ph==='r2rev'){const r=S.rev[ti];st=(r.ans!=null&&r.ans!=='tie'?LET[r.ans]+' нұсқасы · ':'')+(r.pts?'+'+r.pts+' · ':'')+r.note;cl=r.pts>=70?'ok':(r.ans==='tie'?'tie':'');}
    else if(ph==='r2play'){st=t.m.length+' адам';}
    else{const r=tally(ti,S.si);st=r.n===0?'Талқылауда…':r.ans==='tie'?'Тең дауыс! Келісіңдер':r.cons?'Бірауызды пікір':'Пікір бөлінді';cl=r.ans==='tie'?'tie':r.cons?'ok':'';st=r.n+'/'+t.m.length+' дауыс · '+st;}
    return `<div class="tst" style="--tc:${t.c}"><span class="scv">${t.score}</span><b>${esc(t.name)}</b><div class="st ${cl}">${esc(st)}</div></div>`;}).join('');
  }
  if(ph==='r2vote'||ph==='r2rev'){
   const sc=R2[S.si],rv=ph==='r2rev',el=$('#r2o');
   if(el){el.innerHTML=sc.o.map((o,i)=>{
     const tags=rv?S.teams.map((t,ti)=>S.rev[ti]&&S.rev[ti].ans===i?`<span class="tag" style="--tc:${t.c}">${esc(t.name)}</span>`:'').join(''):'';
     const best=rv&&o.s===Math.max(...sc.o.map(x=>x.s));
     return `<div class="opt-b ${rv?'click':''} ${best?'best':''} ${rv&&openOpt===i?'open':''}" data-i="${i}"><div class="row"><span class="L">${LET[i]}</span><span>${esc(o.t)}${rv?`<div class="score">${Array.from({length:10},(_,k)=>`<i class="${k<Math.round(o.s/10)?'on':''}"></i>`).join('')}</div>`:''}</span><span class="pc">${rv?o.s:''}</span></div>${tags?`<div class="tags">${tags}</div>`:''}<div class="why">${esc(o.w)}</div></div>`;}).join('');
    if(rv)el.querySelectorAll('.opt-b').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;openOpt=openOpt===i?-1:i;live();});}
  }
  if(ph==='refl'){
   const c=[0,0,0,0,0];ps.forEach(p=>{if(p.refl!=null)c[p.refl]++;});const mx=Math.max(1,...c);
   const rb=$('#rb');if(rb)rb.innerHTML=STAGES.map((s,i)=>`<div class="rb"><span>${s.name}</span><div class="tr"><div style="width:${c[i]/mx*100}%"></div></div><b>${c[i]}</b></div>`).join('');
   const rc=$('#rc');if(rc)rc.textContent=c.reduce((a,b)=>a+b,0)+' / '+ps.length;
  }
 }
 setInterval(()=>{
  if(S.phase!=='r2vote')return;
  const r=Math.max(0,S.deadline-Date.now());
  const n=$('#tnum'),b=$('#tbar');if(n)n.textContent=Math.ceil(r/1000);if(b)b.style.width=(r/(QTIME*1000)*100)+'%';
  if(r<=0)reveal();
 },250);
 setInterval(()=>{let ch=false;P().forEach(p=>{if(!p.bot&&p.on&&Date.now()-(p.seen||0)>30000){p.on=false;ch=true;}});if(ch)live();},5000);
 newPeer();
}

/* ======================= СТУДЕНТ ТЕЛЕФОНЫ ======================= */
function player(code0,b0){
 document.body.className='phone';
 let code=code0,cl=null,V=null,bi=b0||0,joinT=null,pingT=null,online=false;
 let pid=ls.get('tuj-pid');if(!pid){pid='p'+Math.random().toString(36).slice(2,10);ls.set('tuj-pid',pid);}
 let name=ls.get('tuj-name')||'';
 const send=d=>{if(cl&&online){try{cl.publish(NS+code+'/up',JSON.stringify({...d,pid}),{qos:1});}catch(e){}}};
 const head=()=>V&&V.team?`<div class="who"><span class="emb" style="background:${V.team.c}">${esc(V.team.name[0])}</span>${esc(V.name)} · ${esc(V.team.name)} командасы · ${V.team.score} ұпай</div>`:`<div class="who"><svg width="30" height="15" class="orn"><use href="#orn"/></svg>${esc(V?V.name:name)}</div>`;
 const look=t=>`<div class="look">${eyeSvg}<span>${t}</span></div>`;
 function form(err){
  app.innerHTML=`<div style="padding-top:7vh"><svg width="70" height="35" class="orn"><use href="#orn"/></svg><h1 style="margin:12px 0">Тұлғадан — ұжымға</h1>
   <div class="pcard" style="display:grid;gap:12px">${code?`<div class="mut">Бөлме: <b style="color:var(--ink)">${esc(code)}</b></div>`:'<label>Бөлме коды<input id="cd" maxlength="4" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;margin-top:6px"></label>'}
   <label>Атыңыз<input id="nm" maxlength="22" value="${esc(name)}" autocomplete="given-name" style="margin-top:6px"></label>
   ${err?`<div class="err">${esc(err)}</div>`:''}<button class="btn" id="go">Кіру</button></div></div>`;
  $('#go').onclick=()=>{const n=$('#nm').value.trim();const c=code||($('#cd')?$('#cd').value.trim().toUpperCase():'');if(!n||c.length!==4){form('Код (4 таңба) мен атыңызды енгізіңіз');return;}name=n;code=c;ls.set('tuj-name',n);if(cl&&online){wait('Тақтаны іздеп жатырмын…','Бөлме: '+esc(code));cl.subscribe(NS+code+'/p/'+pid,{qos:1},()=>askJoin(0));}else connect();};
 }
 function wait(t,sub){app.innerHTML=`${head()}<div class="pcard" style="text-align:center;padding:36px 20px"><svg width="80" height="40" class="orn"><use href="#orn"/></svg><h2 style="margin:14px 0 8px">${t}</h2><p class="mut">${sub||''}</p></div>`;}
 function connect(){
  if(!window.mqtt){form('Байланыс кітапханасы жүктелмеді. Интернетті тексеріп, бетті жаңартыңыз.');return;}
  wait('Серверге қосылуда…','Бір сәт');
  let first=true;
  mconnect(bi,(c,i)=>{
   cl=c;online=true;
   if(first){first=false;cl.on('message',(tp,pl)=>{const d=dec(pl);if(d&&d.t==='state'){clearTimeout(joinT);onState(d.v);}});
    clearInterval(pingT);pingT=setInterval(()=>send({t:'ping'}),10000);}
   cl.subscribe(NS+code+'/p/'+pid,{qos:1},()=>{if(!V)wait('Тақтаны іздеп жатырмын…','Бөлме: '+esc(code));askJoin(0);});
  },()=>{online=false;if(V)wait('Байланыс үзілді','Қайта қосылуда… Интернетті тексеріңіз.');});
 }
 function askJoin(n){
  send({t:'join',name});clearTimeout(joinT);
  joinT=setTimeout(()=>{
   if(n>=3&&!V){app.innerHTML=`<div class="pcard" style="margin-top:10vh"><h2>Тақта жауап бермейді</h2><p class="mut">Бөлме коды <b style="color:var(--ink)">${esc(code)}</b> дұрыс па? Оқытушының экранында ойын ашық тұр ма? Мүмкін болса, QR-кодты қайта сканерлеңіз.</p><button class="btn" id="again" style="width:100%">Қайта көру</button><button class="ghost btn" id="chg" style="width:100%;margin-top:10px">Кодты өзгерту</button></div>`;
    $('#again').onclick=()=>{wait('Тақтаны іздеп жатырмын…','Бөлме: '+esc(code));askJoin(0);};$('#chg').onclick=()=>{code='';form();};return;}
   askJoin(n+1);},4000);
 }
 function onState(v){V=v;draw();}
 function draw(){
  const v=V;
  if(v.phase==='lobby')return wait('Сіз ойындасыз!','Оқытушы бастағанша күте тұрыңыз.');
  if(v.phase==='r1')return r1();
  if(v.phase==='r1end'||(v.phase==='teams'&&!v.team))return result();
  if(v.phase==='teams')return team();
  if(v.phase==='r2play')return app.innerHTML=`${head()}${look('Тақтаға қараңыз: оқиға жүріп жатыр. Кім не айтады, кім үндемейді — бәрін байқаңыз.')}<div class="pcard"><span class="mut">Сахна ${v.si+1} / ${R2.length}</span><h2 style="margin-top:6px">${esc(R2[v.si].title)}</h2><p class="mut">Көріп болған соң командаңызбен бірге шешім қабылдайсыздар. Талқылауды қазірден бастай беріңіз!</p></div>`;
  if(v.phase==='r2vote')return vote();
  if(v.phase==='r2rev')return rev();
  if(v.phase==='refl')return refl();
  if(v.phase==='end')return end();
 }
 function r1(){
  const sc=R1[V.si];
  app.innerHTML=`${head()}${look('Тақтадағы оқиғаны қараңыз')}<div class="kick" style="margin-top:14px">Оқиға ${V.si+1} / ${R1.length} · ${esc(sc.title)}</div><h2>${esc(sc.q)}</h2>
   <div class="opts">${ORD[V.si].map((k,li)=>`<button class="opt ${V.my===k?'sel':''}" data-k="${k}"><span class="L">${LET[li]}</span><span>${esc(sc.o[k][0])}</span></button>`).join('')}</div>
   <p class="mut" style="font-size:14px">${V.my!=null?'Жауабыңыз қабылданды. Келесі оқиғаға дейін өзгертуге болады.':'Дұрыс не бұрыс жауап жоқ — шын өзіңізді таңдаңыз.'}</p>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>send({t:'a1',si:V.si,k:+b.dataset.k}));
 }
 function result(){
  const r=V.res;if(!r)return wait('Талдау дайын емес','Сіз 1-раундтың оқиғаларына жауап бермедіңіз. 2-раунд жақында басталады.');
  const T=TYPES[r.type];const[x,y]=pos(r.e,r.n,false);
  app.innerHTML=`${head()}<div class="res" style="background:${T.col}">
   <span class="lab">4 оқиғадағы таңдауыңыз бойынша</span><h1>${T.name}</h1><div class="nick">${T.nick}</div>
   <svg viewBox="0 0 600 600" style="width:120px;float:right;margin:0 0 8px 10px"><circle cx="300" cy="300" r="285" fill="#12323a"/>${quads()}<circle cx="${x}" cy="${y}" r="28" fill="#12323a"/><circle cx="${x}" cy="${y}" r="14" fill="${T.col}"/></svg>
   <p>${T.d}</p><p><span class="lab">Ұжымдағы күшіңіз</span>${T.plus}</p><p><span class="lab">Даму аймағы</span>${T.grow}</p>
   <div class="picks"><span class="lab">Сіздің таңдауларыңыз</span>${Object.keys(TYPES).map(k=>`<div><span>${TYPES[k].name}</span><span class="t"><i style="width:${r.cnt[k]/r.total*100}%"></i></span><b>${r.cnt[k]}</b></div>`).join('')}</div></div>
   <p class="mut" style="font-size:14px;margin-top:14px">Бұл — ойын нұсқасы, диагноз емес. Темперамент — тұлғаның табиғи негізі ғана; мінез, қабілет пен бағыттылық әрекет пен қарым-қатынаста қалыптасады. Таңдауларыңыз әртүрлі болса — бұл қалыпты: тұлға жағдайға қарай әртүрлі қырын көрсетеді.</p>`;
 }
 function team(){
  const t=V.team;
  app.innerHTML=`${head()}<div class="pcard" style="border-top:8px solid ${t.c}"><span class="mut">Сіздің командаңыз</span>
   <h1 style="display:flex;gap:12px;align-items:center;margin:8px 0 12px"><span class="emb" style="background:${t.c}">${esc(t.name[0])}</span>${esc(t.name)}</h1>
   <div class="mates">${t.m.map(n=>`<div><span>${esc(n)}</span></div>`).join('')}</div></div>
   <p class="mut">Командаңызды тауып, бірге отырыңыз. 2-раундта ортақ шешім қабылдайсыздар: тең дауыс — 0 ұпай.</p>
   <button class="ghost btn" id="my" style="width:100%">Жеке талдауымды қайта қарау</button>`;
  $('#my').onclick=result;
 }
 let tick=null;
 function timerBar(){clearInterval(tick);const end=Date.now()+(V.rem||0),tot=QTIME*1000;
  tick=setInterval(()=>{const b=$('#tb');if(!b){clearInterval(tick);return;}const r=Math.max(0,end-Date.now());b.style.width=(r/tot*100)+'%';const s=$('#ts');if(s)s.textContent=Math.ceil(r/1000)+' с';},250);}
 function vote(){
  const sc=R2[V.si],tt=V.tt||{};
  const status=!tt.n?'Әзірге ешкім дауыс бермеді':tt.ans==='tie'?'Тең дауыс! Талқылап, бір шешімге келіңдер':tt.cons?'Командада бірауызды пікір':'Пікір бөлінді — дәлелдеріңді айт!';
  app.innerHTML=`${head()}<div class="tbar"><div id="tb" style="width:100%"></div></div><div class="kick" style="margin-top:10px">Сахна ${V.si+1} · ${esc(sc.title)} · <span id="ts"></span></div>
   <h2>${esc(sc.q)}</h2>
   <div class="opts">${sc.o.map((o,i)=>`<button class="opt ${V.my===i?'sel':''}" data-i="${i}"><span class="L">${LET[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
   <div class="pcard"><b>${esc(status)}</b><div class="mates">${(V.tv||[]).map(([n,o])=>`<div><span>${esc(n)}</span><span class="mut">${o==null?'ойлануда…':LET[o]+' нұсқасы'}</span></div>`).join('')}</div></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>send({t:'vote',q:V.si,o:+b.dataset.i}));
  timerBar();
 }
 function rev(){
  const sc=R2[V.si],r=V.rv;const bi=sc.o.reduce((b,o,i)=>o.s>sc.o[b].s?i:b,0);
  const has=r&&r.ans!=null&&r.ans!=='tie';
  app.innerHTML=`${head()}<div class="pcard" style="text-align:center;background:${r&&r.pts>=70?'var(--P)':'var(--card)'};color:${r&&r.pts>=70?'#08302c':'inherit'}">
   <div class="big-ok">${r?'+'+r.pts:'—'}</div><p style="font-size:17px;margin:6px 0 0">${r?esc(r.note):''}</p></div>
   ${has?`<div class="pcard"><span class="mut">Командаңыздың шешімі · сарапшы бағасы ${sc.o[r.ans].s}/100</span><h2 style="margin:6px 0 8px;font-size:19px">${LET[r.ans]}. ${esc(sc.o[r.ans].t)}</h2><p style="margin:0">${esc(sc.o[r.ans].w)}</p></div>`:''}
   ${!has||r.ans!==bi?`<div class="pcard"><span class="mut">Ең сындарлы нұсқа</span><h2 style="margin:6px 0 8px;font-size:19px">${LET[bi]}. ${esc(sc.o[bi].t)}</h2><p style="margin:0">${esc(sc.o[bi].w)}</p></div>`:''}
   <p class="mut"><b style="color:var(--S)">Кезең:</b> ${esc(sc.stage)}</p>`;
 }
 function refl(){
  app.innerHTML=`${head()}<div class="kick" style="margin-top:14px">Жеке пікір · анонимді</div><h2>Ал сіздің академиялық тобыңыз қазір қай кезеңде?</h2>
   <div class="opts">${STAGES.map((s,i)=>`<button class="opt ${V.my===i?'sel':''}" data-i="${i}"><span class="L">${i+1}</span><span><b>${s.name}</b><br><small class="mut">${s.d}</small></span></button>`).join('')}</div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>send({t:'refl',o:+b.dataset.i}));
 }
 function end(){
  const T=V.res?TYPES[V.res.type]:null;
  app.innerHTML=`${head()}<div class="pcard" style="text-align:center"><svg width="80" height="40" class="orn"><use href="#orn"/></svg>
   <h1 style="margin:12px 0">Ойын аяқталды!</h1>${V.rank?`<p style="font-size:20px">${esc(V.team.name)}: <b>${V.rank}-орын</b> · ${V.team.score} ұпай</p>`:''}
   ${T?`<p class="mut">Сіз — ${T.name}, ${T.nick}. ${T.plus}</p>`:''}</div>
   <p class="mut">Ұжым — тұлғалардың жай жиынтығы емес. Әртүрлі темпераменттер ортақ мақсатқа бағытталғанда ғана топ ұжымға айналады.</p>`;
 }
 if(code&&name)connect();else form();
}
}
</script>
</body>
</html>
